name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads its version from package.json's "packageManager" field —
      # do NOT also pass a `version` input here, pnpm/action-setup@v4
      # errors (ERR_PNPM_BAD_PM_VERSION) if the two disagree.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Token-usage check
        run: pnpm lint:tokens

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Tree-shake check
        run: pnpm check:treeshake

      - name: Build Storybook
        run: pnpm build-storybook
