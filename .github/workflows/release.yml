name: Release

# Publishes @dive-your-mind/dym-design-system to GitHub Packages via
# Changesets when changesets land on main. Auth uses the repo's built-in
# GITHUB_TOKEN (via the `packages: write` permission below) — no manual
# secret needs to be configured, since GitHub Packages is scoped to this
# same repo/org.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads its version from package.json's "packageManager" field —
      # do NOT also pass a `version` input here, pnpm/action-setup@v4
      # errors (ERR_PNPM_BAD_PM_VERSION) if the two disagree.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@dive-your-mind"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
